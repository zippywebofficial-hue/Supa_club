<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supa Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; }
        .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
        .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        .content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 1; }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Yeh line confirm karo ki video ka naam 'video.mp4' hi hai -->
        <video autoplay muted loop playsinline class="video-bg">
            <source src="video.mp4" type="video/mp4">
        </video>
        
        <div class="content">
            <h1 class="text-5xl font-bold text-amber-500">SUPA CLUB</h1>
            <p class="mt-4 text-xl">Luxury Fitness</p>
        </div>
    </section>

</body>
</html>
